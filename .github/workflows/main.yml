name: Checks

on:
  push:
    branches:
      - develop
      - master
  # No branch filter: a phase branch is often stacked on the previous phase
  # rather than on develop, and those pull requests still need checking.
  # No path filter either, so every pull request reports a result instead of
  # showing no checks at all. The jobs exit early when no PHP file changed.
  # Every check job is skipped for docs/ branches: on their pull requests
  # (head branch starts with docs/) and on the push that merges them into
  # develop (the merge commit subject names the branch). Keep docs/ branches
  # free of code changes, because nothing checks them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Warn-only by owner decision; this job never blocks a merge.
  dependency-audit:
    name: Composer Audit
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit locked dependencies
        run: |
          if composer audit --locked --no-interaction; then
            exit 0
          else
            echo "::warning title=composer audit::Composer audit reported advisories or could not complete."
            exit 0
          fi

  syntax:
    name: PHP ${{ matrix.php-version }} Syntax
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  coding-standards:
    name: PHP 8.2 Coding Standards
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Check coding standards on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -d '' php_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No PHP files changed."
            exit 0
          fi
          for php_file in "${php_files[@]}"; do
            vendor/bin/php-cs-fixer fix "$php_file" --verbose --ansi --dry-run --config=.php-cs-fixer.no-header.php --using-cache=no --diff
          done

  # Runs on 8.2 only. composer.lock pins dev tooling (PHPUnit 11 and its
  # sebastian/* dependencies) that requires PHP 8.2 or later, so the dev
  # dependencies cannot be installed on 8.1 at all. The application itself still
  # supports 8.1, which the syntax job above checks. Database tests need MariaDB;
  # fail-on-skipped catches a database setup failure instead of hiding it.
  tests:
    name: PHP 8.2 Tests
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04
    env:
      MYSQL_HOST_NAME: 127.0.0.1
      MYSQL_DB_NAME: ospos
      MYSQL_USERNAME: admin
      MYSQL_PASSWORD: pointofsale
    services:
      mysql:
        image: mariadb:10.5
        # Throwaway CI values matching docker-compose.dev.yml.
        env:
          MYSQL_ROOT_PASSWORD: pointofsale
          MYSQL_DATABASE: ospos
          MYSQL_USER: admin
          MYSQL_PASSWORD: pointofsale
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=pointofsale"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, gd, zip, mysqli
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> "$GITHUB_ENV"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      - name: Load the test database schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u admin -ppointofsale ospos < app/Database/tables.sql
          mysql -h 127.0.0.1 -P 3306 -u admin -ppointofsale ospos < app/Database/constraints.sql

      - name: Run database migrations
        run: php docker/migrations.php migrate

      - name: Check database migrations ran
        run: |
          migration_count="$(mysql -h 127.0.0.1 -P 3306 -u admin -ppointofsale --batch --skip-column-names --execute='SELECT COUNT(*) FROM ospos_migrations' ospos)"
          if [ "$migration_count" -lt 1 ]; then
            echo "The ospos_migrations table has no rows."
            exit 1
          fi
          echo "ospos_migrations has $migration_count rows."

      # The generated front-end assets are gitignored, so build them before
      # AssetIntegrityTest checks the generated header partial and its files.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage --colors=always --fail-on-skipped

  image:
    name: Shop image
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'docs/')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The image copies the whole repository, but ordinary code changes are
      # covered by the other jobs. Build only for files that decide how the
      # image is built or how the app starts, and for this workflow itself.
      - name: Check for image-related changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          image_files="$(grep -E '^(Dockerfile$|\.dockerignore$|docker/|composer\.json$|composer\.lock$|package\.json$|package-lock\.json$|gulpfile\.js$|app/Database/|app/Config/|public/index\.php$|public/\.htaccess$|\.github/workflows/)' <<< "$changed_files" || true)"
          if [ -n "$image_files" ]; then
            echo "Image-related files changed:"
            echo "$image_files"
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-related files changed."
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build shop image
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ospos
          platforms: linux/amd64
          push: false
          load: true
          tags: osposlb-ci:pr
          cache-from: type=gha

      - name: Check image startup
        id: startup
        if: steps.changes.outputs.image == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker network create ospos-ci
          docker run --detach --name mysql --network ospos-ci \
            --env MYSQL_ROOT_PASSWORD=pointofsale \
            --env MYSQL_DATABASE=ospos \
            --env MYSQL_USER=admin \
            --env MYSQL_PASSWORD=pointofsale \
            --volume "$GITHUB_WORKSPACE/app/Database/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro" \
            --volume "$GITHUB_WORKSPACE/app/Database/constraints.sql:/docker-entrypoint-initdb.d/02-constraints.sql:ro" \
            mariadb:10.5
          docker run --detach --name ospos --network ospos-ci \
            --publish 127.0.0.1:8080:80 \
            --env CI_ENVIRONMENT=production \
            --env FORCE_HTTPS=false \
            --env PHP_TIMEZONE=UTC \
            --env MYSQL_HOST_NAME=mysql \
            --env MYSQL_DB_NAME=ospos \
            --env MYSQL_USERNAME=admin \
            --env MYSQL_PASSWORD=pointofsale \
            osposlb-ci:pr

          for ((attempt = 1; attempt <= 180; attempt++)); do
            if [ "$(docker inspect --format='{{.State.Running}}' ospos)" != "true" ]; then
              echo "The ospos container stopped before the login page became ready."
              exit 1
            fi

            http_status="$(curl -fs -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login || true)"
            if [ "$http_status" = "200" ]; then
              app_logs="$(docker logs ospos 2>&1)"
              if ! grep -Fq 'Migrations complete.' <<< "$app_logs"; then
                echo "The ospos entry point did not report completed migrations."
                exit 1
              fi
              grep -E "^(The database is ready|Migrations complete|Starting Apache)" <<< "$app_logs" || true
              echo "The login page returned HTTP 200 and migrations completed."
              exit 0
            fi

            sleep 1
          done

          echo "The login page did not return HTTP 200 within 180 seconds."
          exit 1

      - name: Show startup logs after a failure
        if: failure() && steps.startup.outcome == 'failure' && steps.changes.outputs.image == 'true'
        run: |
          docker logs ospos 2>&1 || true
          docker logs mysql 2>&1 || true

  workflow-lint:
    name: Workflow lint
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for workflow changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '.github/workflows/')"
          if [ -n "$changed_files" ]; then
            echo "Workflow files changed:"
            echo "$changed_files"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "No workflow files changed."
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint workflows
        if: steps.changes.outputs.workflows == 'true'
        # actionlint 1.7.7 does not know GitHub's supported queue: max setting.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro -w /repo rhysd/actionlint:1.7.7 -color -ignore 'unexpected key "queue" for "concurrency" section'
          echo "actionlint found no problems."

  # The one check the develop ruleset requires before a pull request can merge.
  # It always runs and passes when every needed job passed or was skipped
  # (docs/ branches), so skipped checks never block a merge. Requiring the
  # matrix jobs directly would not work: a skipped matrix job reports its raw
  # name ("PHP ${{ matrix.php-version }} Syntax") and the required name never
  # appears. Composer Audit is warn-only, so it is not listed here.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [syntax, coding-standards, tests, image, workflow-lint]
    runs-on: ubuntu-22.04

    steps:
      - name: Fail when a needed check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # Only publish on pushes to develop after every check has passed.
  # Merges of docs/ and chore/ branches are skipped: they do not change the shop.
  # The merge commit subject names the branch, e.g.
  # "Merge pull request #99 from HassanMSh/docs/agents-phase4-status".
  # Publishes run one at a time.
  # Only the newest published develop commit moves the develop tag.
  publish:
    name: Publish shop image
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      !contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)) &&
      !contains(github.event.head_commit.message, format('from {0}/chore/', github.repository_owner))
    needs: [syntax, coding-standards, tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: publish-shop-image
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether this commit is the tip of develop
        id: tip
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --quiet --no-tags --depth=50 origin develop || {
            echo "::error::Could not fetch the tip of develop from origin."
            exit 1
          }
          develop_sha="$(git rev-parse FETCH_HEAD)"
          # Docs and chore merges never publish, so this commit still counts as
          # the tip when only such merges landed on develop after it.
          newer_subjects="$(git log --first-parent --format=%s "$COMMIT_SHA..$develop_sha")"
          skipped_merge="^Merge pull request #[0-9]+ from ${OWNER}/(docs|chore)/"
          if [ -z "$newer_subjects" ] || ! grep -Evq "$skipped_merge" <<< "$newer_subjects"; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Commit $COMMIT_SHA is no longer the tip of develop; left the moving develop tag alone."
          fi

      - name: Set short SHA
        id: sha
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          IS_DEVELOP_TIP: ${{ steps.tip.outputs.is_tip }}
        run: |
          {
            echo "tags<<EOF"
            echo "hassanshamseddine/osposlb:develop-${SHORT_SHA}"
            if [ "$IS_DEVELOP_TIP" = "true" ]; then
              echo "hassanshamseddine/osposlb:develop"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB }}

      - name: Build and publish shop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ospos
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
