name: Checks

on:
  push:
    branches:
      - develop
      - master
  # No branch filter: a phase branch is often stacked on the previous phase
  # rather than on develop, and those pull requests still need checking.
  # No path filter either, so every pull request reports a result instead of
  # showing no checks at all. The jobs exit early when no PHP file changed.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php-version }} Syntax
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  coding-standards:
    name: PHP 8.2 Coding Standards
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Check coding standards on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -d '' php_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No PHP files changed."
            exit 0
          fi
          for php_file in "${php_files[@]}"; do
            vendor/bin/php-cs-fixer fix "$php_file" --verbose --ansi --dry-run --config=.php-cs-fixer.no-header.php --using-cache=no --diff
          done

  # Runs on 8.2 only. composer.lock pins dev tooling (PHPUnit 11 and its
  # sebastian/* dependencies) that requires PHP 8.2 or later, so the dev
  # dependencies cannot be installed on 8.1 at all. The application itself still
  # supports 8.1, which the syntax job above checks.
  tests:
    name: PHP 8.2 Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, gd, zip
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      # The built front-end assets are gitignored, but the tracked page header
      # references them by content hash. A bare checkout therefore has none of
      # them, and AssetIntegrityTest fails. Building here keeps that test
      # meaningful and proves the asset build itself still works on every change.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage --colors=always

  # Only publish on pushes to develop after every check has passed.
  # Publishes run one at a time.
  # Only the newest develop commit moves the develop tag.
  publish:
    name: Publish shop image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [syntax, coding-standards, tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: publish-shop-image
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether this commit is the tip of develop
        id: tip
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          develop_sha="$(git ls-remote origin refs/heads/develop | cut -f1)" || {
            echo "::error::Could not look up the tip of develop from origin."
            exit 1
          }
          if [ -z "$develop_sha" ]; then
            echo "::error::The lookup returned no tip SHA for develop."
            exit 1
          fi
          if [ "$develop_sha" = "$COMMIT_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Commit $COMMIT_SHA is no longer the tip of develop; left the moving develop tag alone."
          fi

      - name: Set short SHA
        id: sha
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          IS_DEVELOP_TIP: ${{ steps.tip.outputs.is_tip }}
        run: |
          {
            echo "tags<<EOF"
            echo "hassanshamseddine/osposlb:develop-${SHORT_SHA}"
            if [ "$IS_DEVELOP_TIP" = "true" ]; then
              echo "hassanshamseddine/osposlb:develop"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB }}

      - name: Build and publish shop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ospos
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
