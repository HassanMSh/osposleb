name: Checks

on:
  push:
    branches:
      - develop
      - master
  # No branch filter: a phase branch is often stacked on the previous phase
  # rather than on develop, and those pull requests still need checking.
  # No path filter either, so every pull request reports a result instead of
  # showing no checks at all. The jobs exit early when no PHP file changed.
  # Every check job is skipped for docs/ branches: on their pull requests
  # (head branch starts with docs/) and on the push that merges them into
  # develop (the merge commit subject names the branch). Keep docs/ branches
  # free of code changes, because nothing checks them.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Warn-only by owner decision; this job never blocks a merge.
  dependency-audit:
    name: Composer Audit
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit locked dependencies
        run: |
          if composer audit --locked --no-interaction; then
            exit 0
          else
            echo "::warning title=composer audit::Composer audit reported advisories or could not complete."
            exit 0
          fi

  syntax:
    name: PHP ${{ matrix.php-version }} Syntax
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  coding-standards:
    name: PHP 8.2 Coding Standards
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: tokenizer
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Check coding standards on changed PHP files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -d '' php_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No PHP files changed."
            exit 0
          fi
          for php_file in "${php_files[@]}"; do
            vendor/bin/php-cs-fixer fix "$php_file" --verbose --ansi --dry-run --config=.php-cs-fixer.no-header.php --using-cache=no --diff
          done

  # Runs on 8.2 only. composer.lock pins dev tooling (PHPUnit 11 and its
  # sebastian/* dependencies) that requires PHP 8.2 or later, so the dev
  # dependencies cannot be installed on 8.1 at all. The application itself still
  # supports 8.1, which the syntax job above checks.
  tests:
    name: PHP 8.2 Tests
    if: >-
      !startsWith(github.head_ref, 'docs/') &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)))
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, gd, zip
          coverage: none

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress

      # The generated front-end assets are gitignored, so build them before
      # AssetIntegrityTest checks the generated header partial and its files.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-coverage --colors=always

  # The one check the develop ruleset requires before a pull request can merge.
  # It always runs and passes when every needed job passed or was skipped
  # (docs/ branches), so skipped checks never block a merge. Requiring the
  # matrix jobs directly would not work: a skipped matrix job reports its raw
  # name ("PHP ${{ matrix.php-version }} Syntax") and the required name never
  # appears. Composer Audit is warn-only, so it is not listed here.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [syntax, coding-standards, tests]
    runs-on: ubuntu-22.04

    steps:
      - name: Fail when a needed check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # Only publish on pushes to develop after every check has passed.
  # Merges of docs/ and chore/ branches are skipped: they do not change the shop.
  # The merge commit subject names the branch, e.g.
  # "Merge pull request #99 from HassanMSh/docs/agents-phase4-status".
  # Publishes run one at a time.
  # Only the newest published develop commit moves the develop tag.
  publish:
    name: Publish shop image
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      !contains(github.event.head_commit.message, format('from {0}/docs/', github.repository_owner)) &&
      !contains(github.event.head_commit.message, format('from {0}/chore/', github.repository_owner))
    needs: [syntax, coding-standards, tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: publish-shop-image
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether this commit is the tip of develop
        id: tip
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --quiet --no-tags --depth=50 origin develop || {
            echo "::error::Could not fetch the tip of develop from origin."
            exit 1
          }
          develop_sha="$(git rev-parse FETCH_HEAD)"
          # Docs and chore merges never publish, so this commit still counts as
          # the tip when only such merges landed on develop after it.
          newer_subjects="$(git log --first-parent --format=%s "$COMMIT_SHA..$develop_sha")"
          skipped_merge="^Merge pull request #[0-9]+ from ${OWNER}/(docs|chore)/"
          if [ -z "$newer_subjects" ] || ! grep -Evq "$skipped_merge" <<< "$newer_subjects"; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Commit $COMMIT_SHA is no longer the tip of develop; left the moving develop tag alone."
          fi

      - name: Set short SHA
        id: sha
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "short_sha=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          IS_DEVELOP_TIP: ${{ steps.tip.outputs.is_tip }}
        run: |
          {
            echo "tags<<EOF"
            echo "hassanshamseddine/osposlb:develop-${SHORT_SHA}"
            if [ "$IS_DEVELOP_TIP" = "true" ]; then
              echo "hassanshamseddine/osposlb:develop"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB }}

      - name: Build and publish shop image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ospos
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
