services:
    ospos:
        environment: !reset []
        # The till runs on this computer only; other shop devices cannot reach it.
        ports: !override
            - "127.0.0.1:${OSPOS_HTTP_PORT:-80}:80"
        # Docker Desktop on Windows shows the locked secrets file as root-only (mode 600),
        # so the web server user cannot read a direct bind mount. Copy it at start instead.
        command:
            - sh
            - -c
            - install -o www-data -g www-data -m 0400 /run/ospos/app.env /app/.env && exec apache2-foreground
        volumes:
            - ${OSPOS_DATA_DIR}/secrets/app.env:/run/ospos/app.env:ro
            # OSPOS_UPLOADS=client_uploads keeps pictures in a Docker volume (Windows setup sets it),
            # because Docker Desktop shows the Windows uploads folder as root-only.
            - ${OSPOS_UPLOADS:-${OSPOS_DATA_DIR}/uploads}:/app/public/uploads
    mysql:
        container_name: !reset null
        environment: !reset []
        env_file:
            - ${OSPOS_DATA_DIR}/secrets/mysql.env
            - ${OSPOS_DATA_DIR}/secrets/db.env

volumes:
    client_uploads:
        driver: local
