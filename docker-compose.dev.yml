volumes:
    uploads:
        driver: local
    logs:
        driver: local
    mysql:
        driver: local
    vendor:
        driver: local

networks:
    app_net:


services:
    mysql:
        image: mariadb:10.5
        container_name: mysql
        restart: always
        expose:
            - "3306"
        networks:
            - app_net
        volumes:
            - ./app/Database/database.sql:/docker-entrypoint-initdb.d/database.sql
            - mysql:/var/lib/mysql:rw
        environment:
            - MYSQL_ROOT_PASSWORD=pointofsale
            - MYSQL_DATABASE=ospos
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=pointofsale
    ospos:
        build:
            context: .
            args:
                - USERID=${USERID}
                - GROUPID=${GROUPID}
            target: ospos_dev
        container_name: ospos_dev
        restart: always
        user: "${USERID}:${GROUPID}"
        depends_on:
            - mysql
        ports:
            - "80:80"
        networks:
            - app_net
        volumes:
            - .:/app
            # The dependency directory is restored from the image because the bind
            # mount above hides it. The built asset directories are deliberately NOT
            # restored this way: their filenames are content hashes that must match
            # the injected header, and the header comes from the bind mount. Serving
            # image assets against a checkout header reintroduces the 404s this
            # setup exists to prevent. Run "npm install && npm run build" in the
            # checkout instead; AssetIntegrityTest fails loudly when you have not.
            - vendor:/app/vendor
        environment:
            - CI_ENVIRONMENT=development
            - MYSQL_USERNAME=admin
            - MYSQL_PASSWORD=pointofsale
            - MYSQL_DB_NAME=ospos
            - MYSQL_HOST_NAME=mysql
            - PHP_TIMEZONE=UTC
            - XDEBUG_CONFIG=client_host=172.17.0.1
