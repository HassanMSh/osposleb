volumes:
    uploads:
        driver: local
    logs:
        driver: local
    mysql:
        driver: local
    vendor:
        driver: local

networks:
    app_net:


services:
    assets:
        image: node:22-bookworm-slim
        working_dir: /app
        user: "${USERID}:${GROUPID}"
        restart: "no"
        volumes:
            - .:/app
        environment:
            HOME: /tmp
            npm_config_cache: /tmp/npm-cache
        command:
            - sh
            - -c
            - >-
                if [ ! -d node_modules ] || [ ! -f node_modules/.package-lock.json ] ||
                [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci; fi && npm run build
    mysql:
        image: mariadb:10.5
        container_name: mysql
        restart: always
        expose:
            - "3306"
        networks:
            - app_net
        volumes:
            - ./app/Database/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
            - ./app/Database/constraints.sql:/docker-entrypoint-initdb.d/02-constraints.sql:ro
            - mysql:/var/lib/mysql:rw
        environment:
            - MYSQL_ROOT_PASSWORD=pointofsale
            - MYSQL_DATABASE=ospos
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=pointofsale
    ospos:
        build:
            context: .
            args:
                - USERID=${USERID}
                - GROUPID=${GROUPID}
            target: ospos_dev
        container_name: ospos_dev
        restart: always
        user: "${USERID}:${GROUPID}"
        depends_on:
            assets:
                condition: service_completed_successfully
            mysql:
                condition: service_started
        ports:
            - "80:80"
        networks:
            - app_net
        volumes:
            - .:/app
            # The dependency directory is restored from the image because the bind
            # mount above hides it. The assets service builds matching assets and
            # the generated header partial into the checkout before this starts.
            - vendor:/app/vendor
        environment:
            - CI_ENVIRONMENT=development
            - MYSQL_USERNAME=admin
            - MYSQL_PASSWORD=pointofsale
            - MYSQL_DB_NAME=ospos
            - MYSQL_HOST_NAME=mysql
            - PHP_TIMEZONE=UTC
            - XDEBUG_CONFIG=client_host=172.17.0.1
