# gulp-rev writes content-hashed names only in public/resources, resources/css and resources/js.
# The copied theme folders (bootswatch, bootswatch5) keep their package names, so they are left out.
<LocationMatch "^/resources/(?:css/|js/)?[^/]+-[a-f0-9]{10}(?:\.[^./]+)+$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
