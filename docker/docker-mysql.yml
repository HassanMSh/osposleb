
volumes:
    uploads:
        driver: local
    logs:
        driver: local
    mysql:
        driver: local

networks:
    app_net:

services:
    mysql:
        image: mariadb:10.5
        container_name: mysql
        restart: always
        expose:
          - "3306"
        networks:
          - app_net
        volumes:
          - mysql:/var/lib/mysql:rw
          # Use tracked schema sources because database.sql is generated by the front-end build.
          - ../app/Database/tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
          - ../app/Database/constraints.sql:/docker-entrypoint-initdb.d/02-constraints.sql:ro
        environment:
          - MYSQL_ROOT_PASSWORD=pointofsale
          - MYSQL_DATABASE=ospos
          - MYSQL_USER=admin
          - MYSQL_PASSWORD=pointofsale
